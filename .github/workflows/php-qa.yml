name: PHP Quality Assurance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-qa:
    name: PHP QA (PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        php: [ '8.0', '8.1', '8.2', '8.3', '8.4', '8.5' ]
        os: [ 'ubuntu-latest' ]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP (with coverage)
        if: matrix.php == '8.5'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Setup PHP (no coverage)
        if: matrix.php != '8.5'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--prefer-dist --no-interaction --no-progress"

      - name: Run PHPStan
        run: composer phpstan

      - name: Run PHPUnit
        run: |
          if [ "${{ matrix.php }}" = "8.5" ]; then 
            vendor/bin/phpunit -c phpunit11.xml.dist --coverage-text
          else
            vendor/bin/phpunit -c phpunit.xml.dist
          fi

      - name: Run PHP CS Fixer
        if: matrix.php == '8.0'
        run: composer cs-check
